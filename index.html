<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget/Expense Tracker</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>My Budget Tracker</h1>
        <p>
            Welcome to My Budget Tracker! This tool helps me track my expenses
            in one place in an organised manner.
        </p>
    </header>

    <section>
        <h2>Add Expense</h2>

        <input type="text" placeholder="Add expense name...">
        <input type="text" placeholder="Add expense amount...">
        <input type="text" placeholder="Add expense category...">
        <button type="button">Add Expense</button>
    </section>

    <section>
        <h2>Your Expenses</h2>

        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Amount</th>
                    <th>Category</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Groceries</td>
                    <td>$45.00</td>
                    <td>Food</td>
                </tr>
                <tr>
                    <td>Bus Fare</td>
                    <td>$5.50</td>
                    <td>Transport</td>
                </tr>
                <tr>
                    <td>Netflix</td>
                    <td>$12.99</td>
                    <td>Entertainment</td>
                </tr>
            </tbody>
        </table>
    </section>

</body>
</html>
